<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internship Board</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header><h1>Internship Board</h1><p>Find an internship and apply in minutes.</p></header>
  <main>
    <section aria-labelledby="list-h">
      <h2 id="list-h">Open internships</h2>
      <div class="filters">
        <label>Search <input id="q" type="search" maxlength="100" placeholder="Title, company, city"></label>
        <label>Category
          <select id="category"><option value="">All</option><option>engineering</option><option>design</option><option>marketing</option><option>data</option></select>
        </label>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
      <ul id="list" class="cards"></ul>
    </section>

    <section id="apply-section" hidden aria-labelledby="apply-h">
      <h2 id="apply-h">Apply: <span id="apply-title"></span></h2>
      <form id="apply-form" novalidate>
        <label>Full name * <input name="name" maxlength="80" autocomplete="name"></label>
        <p class="err" data-for="name"></p>
        <label>Email * <input name="email" type="email" maxlength="254" autocomplete="email"></label>
        <p class="err" data-for="email"></p>
        <label>Phone <input name="phone" maxlength="20" autocomplete="tel"></label>
        <p class="err" data-for="phone"></p>
        <label>Resume link (https) <input name="resume_url" maxlength="300"></label>
        <p class="err" data-for="resume_url"></p>
        <label>Cover letter * (20-1000 chars) <textarea name="cover_letter" rows="5" maxlength="1000"></textarea></label>
        <p class="err" data-for="cover_letter"></p>
        <label class="check"><input name="consent" type="checkbox"> I agree to share my details with the company *</label>
        <p class="err" data-for="consent"></p>
        <div id="form-status" role="status" aria-live="polite"></div>
        <button type="submit" id="submit-btn">Submit application</button>
        <button type="button" id="cancel-btn" class="secondary">Cancel</button>
      </form>
    </section>
  </main>
  <script src="/validate.js"></script>
  <script src="/app.js"></script>
</body>
</html>
